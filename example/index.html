<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一周小计划 · 虚拟示例</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#293b35;font:17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:680px;margin:10vh auto;padding:28px}small{color:#70867b}h1{font-size:42px;letter-spacing:-2px}label{display:flex;gap:16px;padding:24px;background:white;border-radius:20px;margin:14px 0;align-items:center}input{width:22px;height:22px;accent-color:#688775}footer{margin-top:28px;color:#718077;font-size:14px}#note{color:#a25b39}</style><main><small>WEEKLY NOTES / 虚拟示例</small><h1>这一周，慢慢完成。</h1><p id="count"></p><label><input type="checkbox">整理桌面上的文件</label><label><input type="checkbox">读完一本书的一章</label><label><input type="checkbox">周末出去走一走</label><p id="note"></p><footer>演示数据 · 保存在当前浏览器 · 无需启动服务器</footer></main><script>const boxes=[...document.querySelectorAll('input')];const key='ai-workspace-demo-v1';try{const saved=JSON.parse(localStorage.getItem(key)||'[]');boxes.forEach((b,i)=>b.checked=saved[i]===true)}catch(e){document.querySelector('#note').textContent='当前浏览器无法读取保存的状态。'}function show(){document.querySelector('#count').textContent=`已完成 ${boxes.filter(b=>b.checked).length} / ${boxes.length} 件事`}boxes.forEach(b=>b.addEventListener('change',()=>{show();try{localStorage.setItem(key,JSON.stringify(boxes.map(x=>x.checked)))}catch(e){document.querySelector('#note').textContent='当前浏览器不允许保存；刷新后可能重置。'}}));show();</script></html>
